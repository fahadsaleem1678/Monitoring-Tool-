apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-agent
  namespace: monitoring-tool
spec:
  replicas: 1
  selector:
    matchLabels:
      app: incident-agent
  template:
    metadata:
      labels:
        app: incident-agent
    spec:
      containers:
        - name: incident-agent
          image: incident-agent:0.1.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8090
          envFrom:
            - configMapRef:
                name: monitoring-tool-config
            - secretRef:
                name: monitoring-tool-secrets
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: incident-agent
  namespace: monitoring-tool
spec:
  type: ClusterIP
  selector:
    app: incident-agent
  ports:
    - name: http
      port: 8090
      targetPort: http
