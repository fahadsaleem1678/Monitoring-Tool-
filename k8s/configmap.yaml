apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring-tool-config
  namespace: monitoring-tool
data:
  HTTP_ADDR: ":8080"
  ALLOW_ORIGIN: "*"
  PROMETHEUS_URL: "http://prometheus-stack-kube-prom-prometheus.monitoring.svc.cluster.local:9090"
  PROMETHEUS_TIMEOUT_SECONDS: "10"
  PROMETHEUS_SMOKE_QUERY: "up"
  ALERT_EVAL_INTERVAL_SECONDS: "15"
  BACKEND_URL: "http://monitoring-tool-backend:8080"
  PROMETHEUS_MCP_URL: "http://prometheus-mcp:8091"
  PROMETHEUS_MCP_MODE: "mvp"
  OFFICIAL_PROMETHEUS_MCP_URL: "http://prometheus-mcp-official:8080"
  OFFICIAL_PROMETHEUS_MCP_TIMEOUT_SECONDS: "5"
  KUBERNETES_MCP_URL: "http://kubernetes-mcp:8091"
  KUBERNETES_MCP_MODE: "mvp"
  OFFICIAL_KUBERNETES_MCP_URL: "http://kubernetes-mcp-official:8080"
  OFFICIAL_KUBERNETES_MCP_TIMEOUT_SECONDS: "5"
  AGENT_POLL_INTERVAL_SECONDS: "15"
  LLM_PROVIDER: "ollama"
  OLLAMA_URL: "http://host.docker.internal:11434"
  OLLAMA_MODEL: "qwen2.5:7b"
  MAX_PROMETHEUS_QUERY_RANGE_MINUTES: "60"
  MAX_LOG_LINES: "80"
  LOG_LEVEL: "info"
