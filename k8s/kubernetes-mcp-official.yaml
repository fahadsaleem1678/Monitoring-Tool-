apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubernetes-mcp-official
  namespace: monitoring-tool
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: monitoring-tool-kubernetes-mcp-official-readonly
rules:
  - apiGroups: [""]
    resources: ["pods", "events", "nodes"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "daemonsets", "statefulsets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: monitoring-tool-kubernetes-mcp-official-readonly
subjects:
  - kind: ServiceAccount
    name: kubernetes-mcp-official
    namespace: monitoring-tool
roleRef:
  kind: ClusterRole
  name: monitoring-tool-kubernetes-mcp-official-readonly
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-mcp-official
  namespace: monitoring-tool
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubernetes-mcp-official
  template:
    metadata:
      labels:
        app: kubernetes-mcp-official
    spec:
      serviceAccountName: kubernetes-mcp-official
      containers:
        - name: kubernetes-mcp-official
          image: ghcr.io/containers/kubernetes-mcp-server:v0.0.62
          imagePullPolicy: IfNotPresent
          args:
            - "--port=8080"
            - "--read-only"
            - "--disable-multi-cluster"
            - "--stateless"
            - "--toolsets=core"
            - "--cluster-provider=in-cluster"
            - "--list-output=yaml"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kubernetes-mcp-official
  namespace: monitoring-tool
spec:
  type: ClusterIP
  selector:
    app: kubernetes-mcp-official
  ports:
    - name: http
      port: 8080
      targetPort: http
